<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-label="Animated language focus bars">
<style>
svg{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.card{fill:#07162a;stroke:#1d426a;stroke-width:2}
.track{fill:#102b4d}
.bar{transform-origin:left center;transform:scaleX(0);animation:grow 1.2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.txt{fill:#eaf5ff;font-size:14px;font-weight:800}
.pct{fill:#67e8f9;font-size:13px;font-weight:900}
</style>
<rect x="6" y="6" width="748" height="348" rx="26" class="card"/>
<text x="34" y="42" fill="#67e8f9" font-size="13" font-weight="900" letter-spacing="2">LANGUAGE / RUNTIME FOCUS</text>
<g transform="translate(34 74)">
<text class="txt" x="0" y="0">JavaScript</text><text class="pct" x="690" y="0" text-anchor="end">30%</text>
<rect y="14" width="690" height="14" rx="7" class="track"/><rect y="14" width="690" height="14" rx="7" fill="#38bdf8" class="bar" style="animation-delay:.1s"/>
<text class="txt" x="0" y="60">HTML / CSS</text><text class="pct" x="690" y="60" text-anchor="end">24%</text>
<rect y="74" width="690" height="14" rx="7" class="track"/><rect y="74" width="552" height="14" rx="7" fill="#2563eb" class="bar" style="animation-delay:.25s"/>
<text class="txt" x="0" y="120">Python</text><text class="pct" x="690" y="120" text-anchor="end">18%</text>
<rect y="134" width="690" height="14" rx="7" class="track"/><rect y="134" width="414" height="14" rx="7" fill="#22d3ee" class="bar" style="animation-delay:.4s"/>
<text class="txt" x="0" y="180">PHP</text><text class="pct" x="690" y="180" text-anchor="end">15%</text>
<rect y="194" width="690" height="14" rx="7" class="track"/><rect y="194" width="345" height="14" rx="7" fill="#60a5fa" class="bar" style="animation-delay:.55s"/>
<text class="txt" x="0" y="240">SQL</text><text class="pct" x="690" y="240" text-anchor="end">13%</text>
<rect y="254" width="690" height="14" rx="7" class="track"/><rect y="254" width="299" height="14" rx="7" fill="#0ea5e9" class="bar" style="animation-delay:.7s"/>
</g>
</svg>
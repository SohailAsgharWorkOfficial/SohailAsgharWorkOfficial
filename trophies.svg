<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-label="Animated developer trophy cards">
<style>
svg{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.card{fill:#07162a;stroke:#1d426a;stroke-width:2}
.cell{fill:#102b4d;stroke:#24547f}
.trophy{opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes pop{to{opacity:1;transform:scale(1)}}
.shine{animation:shine 4s ease-in-out 1.5s infinite}
@keyframes shine{0%,40%{transform:translateX(-500px);opacity:0}55%{opacity:.55}75%,100%{transform:translateX(500px);opacity:0}}
.title{fill:#eaf5ff;font-weight:900;font-size:16px}
.small{fill:#8fa8c4;font-size:12px;font-weight:700}
.rank{fill:#67e8f9;font-weight:900;font-size:13px}
</style>
<defs><linearGradient id="shine" x1="0" x2="1"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="clip"><rect x="6" y="6" width="748" height="348" rx="26"/></clipPath></defs>
<rect x="6" y="6" width="748" height="348" rx="26" class="card"/>
<text x="34" y="42" fill="#67e8f9" font-size="13" font-weight="900" letter-spacing="2">ACHIEVEMENTS / TROPHIES</text>
<g class="trophy" style="animation-delay:.2s" transform="translate(34 72)">
<rect width="214" height="110" rx="18" class="cell"/><text x="20" y="34" class="rank">#01</text><text x="20" y="62" class="title">BUILDER</text><text x="20" y="84" class="small">68 public repositories</text><text x="182" y="68" text-anchor="middle" font-size="34">★</text>
</g>
<g class="trophy" style="animation-delay:.45s" transform="translate(273 72)">
<rect width="214" height="110" rx="18" class="cell"/><text x="20" y="34" class="rank">#02</text><text x="20" y="62" class="title">SHIPPER</text><text x="20" y="84" class="small">2,189 contributions</text><text x="182" y="68" text-anchor="middle" font-size="34">⚡</text>
</g>
<g class="trophy" style="animation-delay:.7s" transform="translate(512 72)">
<rect width="214" height="110" rx="18" class="cell"/><text x="20" y="34" class="rank">#03</text><text x="20" y="62" class="title">CONNECTOR</text><text x="20" y="84" class="small">19 followers</text><text x="182" y="68" text-anchor="middle" font-size="34">↗</text>
</g>
<g class="trophy" style="animation-delay:.95s" transform="translate(34 205)">
<rect width="214" height="110" rx="18" class="cell"/><text x="20" y="34" class="rank">#04</text><text x="20" y="62" class="title">STARGAZER</text><text x="20" y="84" class="small">32 stars received</text><text x="182" y="68" text-anchor="middle" font-size="34">★</text>
</g>
<g class="trophy" style="animation-delay:1.2s" transform="translate(273 205)">
<rect width="214" height="110" rx="18" class="cell"/><text x="20" y="34" class="rank">#05</text><text x="20" y="62" class="title">FULL STACK</text><text x="20" y="84" class="small">Web • API • Cloud</text><text x="182" y="68" text-anchor="middle" font-size="34">DEV</text>
</g>
<g class="trophy" style="animation-delay:1.45s" transform="translate(512 205)">
<rect width="214" height="110" rx="18" class="cell"/><text x="20" y="34" class="rank">#06</text><text x="20" y="62" class="title">FINISHER</text><text x="20" y="84" class="small">Finish what i Start</text><text x="182" y="68" text-anchor="middle" font-size="34">✓</text>
</g>
<g clip-path="url(#clip)" class="shine"><rect x="-150" y="0" width="120" height="360" fill="url(#shine)" transform="skewX(-18)"/></g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-label="Local animated GitHub statistics">
<style>
svg{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:transparent}
.card{fill:#07162a;stroke:#1d426a;stroke-width:2}
.ring{fill:none;stroke:#163a61;stroke-width:16}
.arc{fill:none;stroke:#38bdf8;stroke-width:16;stroke-linecap:round;stroke-dasharray:0 999;animation:ring 2s ease-out .4s forwards}
@keyframes ring{to{stroke-dasharray:530 999}}
.row{opacity:0;transform:translateX(-30px);animation:row .7s ease forwards}
@keyframes row{to{opacity:1;transform:translateX(0)}}
.value{fill:#eaf5ff;font-weight:900;font-size:22px}
.label{fill:#8fa8c4;font-size:13px;font-weight:700}
.badge{fill:#102b4d;stroke:#24547f}
</style>
<rect x="6" y="6" width="748" height="348" rx="26" class="card"/>
<text x="34" y="42" fill="#67e8f9" font-size="13" font-weight="900" letter-spacing="2">LOCAL PROFILE STATS</text>
<g transform="translate(155 188)">
<circle r="104" class="ring"/>
<circle r="104" class="arc" transform="rotate(-90)"/>
<text y="-8" text-anchor="middle" class="value">A+</text>
<text y="18" text-anchor="middle" class="label">BUILD RANK</text>
<text y="45" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="800">SHIP • LEARN • REPEAT</text>
</g>
<g transform="translate(315 76)">
<g class="row" style="animation-delay:.55s"><rect width="390" height="48" rx="12" class="badge"/><text x="18" y="21" class="label">PUBLIC REPOSITORIES</text><text x="370" y="32" text-anchor="end" class="value">68</text></g>
<g class="row" style="animation-delay:.75s" transform="translate(0 58)"><rect width="390" height="48" rx="12" class="badge"/><text x="18" y="21" class="label">FOLLOWERS</text><text x="370" y="32" text-anchor="end" class="value">19</text></g>
<g class="row" style="animation-delay:.95s" transform="translate(0 116)"><rect width="390" height="48" rx="12" class="badge"/><text x="18" y="21" class="label">FOLLOWING</text><text x="370" y="32" text-anchor="end" class="value">20</text></g>
<g class="row" style="animation-delay:1.15s" transform="translate(0 174)"><rect width="390" height="48" rx="12" class="badge"/><text x="18" y="21" class="label">STARS RECEIVED</text><text x="370" y="32" text-anchor="end" class="value">32</text></g>
</g>
</svg>